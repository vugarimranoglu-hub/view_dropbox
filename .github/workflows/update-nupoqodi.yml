name: Update YouTube Live Streams

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-live-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Install yt-dlp and PO Token plugin
        run: |
          python -m pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: Setup PO Token provider
        run: |
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          cd bgutil-ytdlp-pot-provider/server
          npm install
          npx tsc

      - name: Start PO Token provider
        run: |
          cd bgutil-ytdlp-pot-provider/server
          nohup node build/main.js > /tmp/bgutil.log 2>&1 &
          sleep 3

      - name: Create cookies file
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
          echo "Cookie file created"

      - name: Update Nu Pogodi
        shell: bash
        continue-on-error: true
        run: |
          URL="https://www.youtube.com/watch?v=rTcMb6C2Nl4"

          STREAM_URL=$(yt-dlp \
            --cookies cookies.txt \
            --js-runtimes deno \
            --remote-components ejs:github \
            --extractor-args "youtube:player_client=tv,mweb,web_safari" \
            -f "best[protocol^=m3u8]/best" \
            -g "$URL" | head -n 1)

          if [ -n "$STREAM_URL" ]; then
            printf '#EXTM3U\n#EXTINF:-1,Nu Pogodi\n%s\n' \
              "$STREAM_URL" > nupogodi.m3u8
            echo "Nu Pogodi URL tapildi."
          else
            echo "Nu Pogodi URL tapilmadi."
            exit 1
          fi

      - name: Update Stream 2
        shell: bash
        continue-on-error: true
        run: |
          URL="https://www.youtube.com/watch?v=yq_4wXwvngg"

          STREAM_URL=$(yt-dlp \
            --cookies cookies.txt \
            --js-runtimes deno \
            --remote-components ejs:github \
            --extractor-args "youtube:player_client=tv,mweb,web_safari" \
            -f "best[protocol^=m3u8]/best" \
            -g "$URL" | head -n 1)

          if [ -n "$STREAM_URL" ]; then
            printf '#EXTM3U\n#EXTINF:-1,Stream 2\n%s\n' \
              "$STREAM_URL" > stream2.m3u8
            echo "Stream 2 URL tapildi."
          else
            echo "Stream 2 URL tapilmadi."
            exit 1
          fi

      - name: Delete cookies
        if: always()
        run: |
          rm -f cookies.txt

      - name: Show PO Token log
        if: always()
        run: |
          echo "===== PO TOKEN PROVIDER LOG ====="
          cat /tmp/bgutil.log || true

      - name: Commit updated streams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          [ -f nupogodi.m3u8 ] && git add nupogodi.m3u8
          [ -f stream2.m3u8 ] && git add stream2.m3u8

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update YouTube live streams"
            git push
          fi
