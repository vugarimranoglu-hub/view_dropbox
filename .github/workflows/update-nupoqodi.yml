name: Update YouTube Live Streams

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-live-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Install yt-dlp and PO Token plugin
        run: |
          python -m pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: Setup PO Token provider
        run: |
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          cd bgutil-ytdlp-pot-provider/server
          npm install
          npx tsc

      - name: Start PO Token provider
        run: |
          cd bgutil-ytdlp-pot-provider/server
          nohup node build/main.js > /tmp/bgutil.log 2>&1 &
          sleep 3

      - name: Update Nu Pogodi
        shell: bash
        continue-on-error: true
        run: |
          URL="https://www.youtube.com/watch?v=rTcMb6C2Nl4"

          STREAM_URL=$(yt-dlp \
            --js-runtimes deno \
            --remote-components ejs:github \
            --extractor-args "youtube:player_client=tv,mweb,web_safari" \
            -f "best[protocol^=m3u8]/best" \
            -g "$URL" | head -n 1)

          if [ -n "$STREAM_URL" ]; then
            printf '#EXTM3
