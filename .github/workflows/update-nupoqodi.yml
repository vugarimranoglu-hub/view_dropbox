name: Update YouTube Live Streams

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Install latest yt-dlp
        run: |
          python -m pip install -U "yt-dlp[default]"

      - name: Create cookies file
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > cookies.txt

      # ===== 1-ci YAYIM =====
      - name: Update Nu Pogodi
        shell: bash
        run: |
          YOUTUBE_URL="https://www.youtube.com/watch?v=rTcMb6C2Nl4"

          STREAM_URL=$(yt-dlp \
            --cookies cookies.txt \
            --js-runtimes deno \
            --remote-components ejs:github \
            -f "best[protocol^=m3u8]/best" \
            -g \
            "$YOUTUBE_URL" | head -n 1)

          if [ -n "$STREAM_URL" ]; then
            printf '#EXTM3U\n#EXTINF:-1,Nu Pogodi\n%s\n' \
              "$STREAM_URL" > nupogodi.m3u8
          else
            echo "Nu Pogodi stream tapilmadi."
          fi

      # ===== 2-ci YAYIM =====
      - name: Update Stream 2
        shell: bash
        run: |
          YOUTUBE_URL="https://www.youtube.com/watch?v=yq_4wXwvngg"

          STREAM_URL=$(yt-dlp \
            --cookies cookies.txt \
            --js-runtimes deno \
            --remote-components ejs:github \
            -f "best[protocol^=m3u8]/best" \
            -g \
            "$YOUTUBE_URL" | head -n 1)

          if [ -n "$STREAM_URL" ]; then
            printf '#EXTM3U\n#EXTINF:-1,Stream 2\n%s\n' \
              "$STREAM_URL" > stream2.m3u8
          else
            echo "Stream 2 tapilmadi."
          fi

      - name: Delete cookies
        if: always()
        run: |
          rm -f cookies.txt

      - name: Commit updated streams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"

          git add nupogodi.m3u8 stream2.m3u8

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update YouTube live streams"
            git push
          fi
