name: Update M3U files

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest M3U file
        run: |
          curl -L --fail --retry 3 \
          "https://iptv.org.ua/iptv/avto.m3u8" \
          -o test.m3u

      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add test.m3u

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update test.m3u"
            git push
          fi
